<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphics Pipeline Demo</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a24;
            color: #eaeaea;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        canvas {
            background-color: #282a36;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            border: 2px solid #44475a;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 1.5rem;
            color: #bd93f9;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #8be9fd;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Canvas Graphics Pipeline Demonstration</h1>
        <p>Object 1: Transforming Star | Object 2: Kinetic Orb</p>
    </div>

    <canvas id="graphicsCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById('graphicsCanvas');
        const ctx = canvas.getContext('2d');

        // State variables for our two objects
        let star = { x: 400, y: 250, angle: 0, scale: 1, scaleDir: 0.005 };
        let orb = { x: 100, y: 100, vx: 4, vy: 3, radius: 25 };

        function animate() {
            // Clear the frame for the new draw cycle
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // ==========================================
            // 1. APPLICATION STAGE
            // ==========================================
            // Here we handle the game/simulation logic, physics, 
            // and state updates before any rendering geometry is calculated.
            
            // Update Star State (Rotation and Pulsing)
            star.angle += 0.015;
            star.scale += star.scaleDir;
            if (star.scale > 1.3 || star.scale < 0.7) star.scaleDir *= -1; // Reverse scale

            // Update Orb State (Position and Collision physics)
            orb.x += orb.vx;
            orb.y += orb.vy;
            
            // Wall collision detection for the orb
            if (orb.x + orb.radius > canvas.width || orb.x - orb.radius < 0) orb.vx *= -1;
            if (orb.y + orb.radius > canvas.height || orb.y - orb.radius < 0) orb.vy *= -1;

            // Proceed to render our objects
            renderStar();
            renderOrb();

            // Loop the animation
            requestAnimationFrame(animate);
        }

        function renderStar() {
            ctx.save();
            
            // ==========================================
            // 2. GEOMETRY STAGE (Star)
            // ==========================================
            // We apply spatial transformations (translation, rotation, scaling)
            // and generate the mathematical vertices (vectors) of the polygon.
            ctx.translate(star.x, star.y);
            ctx.rotate(star.angle);
            ctx.scale(star.scale, star.scale);
            
            ctx.beginPath();
            const spikes = 6;
            const outerRadius = 80;
            const innerRadius = 35;
            let rot = Math.PI / 2 * 3;
            let x, y;
            let step = Math.PI / spikes;

            ctx.moveTo(0, -outerRadius);
            for (let i = 0; i < spikes; i++) {
                // Calculate outer vertex
                x = Math.cos(rot) * outerRadius;
                y = Math.sin(rot) * outerRadius;
                ctx.lineTo(x, y);
                rot += step;

                // Calculate inner vertex
                x = Math.cos(rot) * innerRadius;
                y = Math.sin(rot) * innerRadius;
                ctx.lineTo(x, y);
                rot += step;
            }
            ctx.lineTo(0, -outerRadius);
            ctx.closePath();

            // ==========================================
            // 3. RASTERIZATION STAGE (Star)
            // ==========================================
            // Converting the calculated vector paths into actual colored 
            // pixels mapped onto the Canvas pixel buffer.
            ctx.fillStyle = '#ffb86c'; // Fill pixels
            ctx.fill();
            
            ctx.lineWidth = 4;
            ctx.strokeStyle = '#ff5555'; // Outline pixels
            ctx.stroke();

            ctx.restore();
        }

        function renderOrb() {
            ctx.save();

            // ==========================================
            // 2. GEOMETRY STAGE (Orb)
            // ==========================================
            // Defining the mathematical boundaries of a circle path.
            ctx.beginPath();
            ctx.arc(orb.x, orb.y, orb.radius, 0, Math.PI * 2);

            // ==========================================
            // 3. RASTERIZATION STAGE (Orb)
            // ==========================================
            // Generating a visual shader (radial gradient) and rasterizing 
            // the generated circle path to screen pixels.
            let gradient = ctx.createRadialGradient(
                orb.x - orb.radius/3, orb.y - orb.radius/3, orb.radius/8, 
                orb.x, orb.y, orb.radius
            );
            gradient.addColorStop(0, '#50fa7b'); // Inner color
            gradient.addColorStop(1, '#028a31'); // Outer color
            
            ctx.fillStyle = gradient; // Map shader to fill
            ctx.fill(); // Rasterize interior
            
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#f1fa8c';
            ctx.stroke(); // Rasterize border

            ctx.restore();
        }

        // Start the graphics pipeline loop
        animate();
    </script>
</body>
</html>
